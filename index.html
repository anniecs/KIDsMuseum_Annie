    <style>
        /* 童話風整體背景 */
        body {
            font-family: 'Comic Sans MS', 'Nunito', 'Microsoft JhengHei', cursive, sans-serif;
            background: linear-gradient(180deg, #ffe6fa 0%, #e6f9ff 100%);
            color: #5c4a4d;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 移除行動裝置點擊的高光與預設 focus，避免殘留記憶 */
        button, a, select, .map-dot {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* 標題設計 */
        h1 {
            color: #ff8fab;
            font-size: 2.5em;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #fce0e5;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-align: center;
        }

        p.subtitle {
            color: #8fa0b3;
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* 主內容佈局：左側地圖，右側清單 */
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
            align-items: flex-start;
        }

        /* 左側區域：地圖 */
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 右側區域：動態清單 */
        .right-panel {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 143, 171, 0.2);
            border: 4px dashed #bde0fe;
            min-height: 500px;
            max-height: 750px;
            overflow-y: auto;
            position: sticky;
            top: 20px;
            min-width: 350px;
        }

        .right-panel h2 {
            color: #ff6b6b;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #ffc2d1;
            padding-bottom: 10px;
        }

        .filter-status {
            font-size: 1em;
            color: #8fa0b3;
            text-align: center;
            margin-bottom: 15px;
            background: #fdf5f6;
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* 地圖區域 */
        .map-wrapper {
            position: relative;
            width: 100%;
            background-color: #e6f9ff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 5px solid #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .map-wrapper::before {
            content: "🍄 請確認已將圖片存為 map.png 🍄";
            position: absolute;
            color: #ff99ac;
            font-size: 1em;
            font-weight: bold;
            z-index: 0;
        }

        .base-map {
            width: 100%;
            display: block;
            position: relative;
            z-index: 1;
        }

        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 會呼吸的魔法圓點 */
        .map-dot {
            fill: rgba(255, 209, 102, 0.85);
            stroke: rgba(255, 107, 107, 0.9);
            cursor: pointer;
            pointer-events: auto;
            transform-origin: center;
            animation: breathe 2s infinite alternate;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes breathe {
            0% { r: 1.0; stroke-width: 0.3; }
            100% { r: 1.5; stroke-width: 0.5; filter: drop-shadow(0 0 3px rgba(255, 209, 102, 0.8)); }
        }

        .map-dot:hover, .map-dot.active {
            fill: rgba(6, 214, 160, 0.95);
            stroke: #fff;
            r: 2.2;
            stroke-width: 0.6;
            animation: none;
            filter: drop-shadow(0 0 5px rgba(6, 214, 160, 0.8));
        }

        /* 博物館列表樣式 */
        .museum-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .museum-item {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-left: 6px solid #ffb5a7;
            animation: fadeIn 0.4s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .museum-item h3 {
            margin: 0 0 8px 0;
            color: #5c4a4d;
            font-size: 1.2em;
        }

        .museum-item p {
            margin: 0 0 8px 0;
            color: #7a8b9e;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .feature-tag {
            display: inline-block;
            background: #fff0f3;
            color: #ff6b6b;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* 按鈕樣式 */
        .museum-link {
            text-decoration: none;
            color: #5c4a4d;
            background-color: #84dcc6;
            font-weight: bold;
            font-size: 0.95em;
            display: block;
            padding: 10px 15px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0px #5ebaa4;
        }

        .museum-link:hover {
            background-color: #a5ffd6;
            transform: translateY(2px);
            box-shadow: 0 2px 0px #5ebaa4;
        }

        /* 初始提示插畫區塊 */
        .empty-state {
            text-align: center;
            color: #bde0fe;
            margin-top: 50px;
            font-size: 4em;
        }
        .empty-state p {
            font-size: 0.25em;
            color: #8fa0b3;
            margin-top: 10px;
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .right-panel { width: 100%; box-sizing: border-box; min-height: 400px; }
        }
    </style>
</head>

            { n: "CMA 兒童藝術博物館", co: "美國", ci: "紐約", u: "https://cmany.org/", f: "鼓勵孩子在家利用環保廢棄物進行創意藝術計畫" },
            { n: "Discover Children's Story Centre 探索兒童故事中心", co: "英國", ci: "倫敦", u: "https://discover.org.uk/", f: "專注於啟發說故事能力與角色扮演的線上資源" },
            { n: "Eureka! 尤里卡國家兒童博物館", co: "英國", ci: "哈利法克斯", u: "https://www.eureka.org.uk/", f: "生動活潑的人體構造與生活科學兒童數位資源" },
            { n: "Young V&A (原 V&A 兒童博物館)", co: "英國", ci: "倫敦", u: "https://www.vam.ac.uk/young", f: "展示各個年代的玩具設計與兒童用品發展史" }
        ];

        // --- 城市地圖座標 (百分比定位) ---
        const cityCoords = {
            "台北": {l: 81.5, t: 44.5}, "台中": {l: 81.3, t: 45.0}, "台東": {l: 81.6, t: 45.5}, "新北": {l: 81.4, t: 44.2},
            "紐約": {l: 30.5, t: 32.5}, "倫敦": {l: 46.5, t: 27.5}, "巴黎": {l: 48.0, t: 29.5}, "洛杉磯": {l: 17.5, t: 38.5},
            "阿姆斯特丹": {l: 49.5, t: 26.5}, "墨爾本": {l: 88.5, t: 78.0}, "華盛頓特區": {l: 29.5, t: 34.5},
            "新加坡": {l: 76.0, t: 58.0}, "芝加哥": {l: 23.5, t: 33.5}, "馬德里": {l: 45.5, t: 33.5},
            "佛羅倫斯": {l: 50.5, t: 30.5}, "東京": {l: 84.5, t: 36.5}, "舊金山": {l: 16.0, t: 36.0},
            "蒙特瑞": {l: 16.5, t: 37.0}, "聖地牙哥": {l: 18.5, t: 40.0}, "雪梨": {l: 92.0, t: 75.5},
            "費城": {l: 30.0, t: 33.5}, "邁阿密": {l: 28.0, t: 42.0}, "坎培拉": {l: 91.0, t: 76.5},
            "威靈頓": {l: 96.0, t: 78.5}, "多倫多": {l: 28.0, t: 31.5}, "雅典": {l: 53.0, t: 35.5},
            "墨西哥城": {l: 22.0, t: 48.0}, "印第安納波利斯": {l: 25.0, t: 34.0}, "波士頓": {l: 31.0, t: 31.5},
            "大米森登": {l: 46.2, t: 27.2}, "羅徹斯特": {l: 28.5, t: 31.0}, "哈利法克斯": {l: 45.5, t: 26.0}
        };

        const svgPoints = document.getElementById('svg-points');
        const listContainer = document.getElementById('museum-list-container');
        const filterStatus = document.getElementById('filter-status');
        
        let currentActiveCity = null;

        // 初始化：在地圖上生成魔法圓點
        for (const [city, coords] of Object.entries(cityCoords)) {
            // 確保該城市在資料庫中有資料才繪製
            if(museumData.some(m => m.ci === city)) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", coords.l + "%");
                circle.setAttribute("cy", coords.t + "%");
                circle.setAttribute("class", "map-dot");
                circle.setAttribute("id", `dot-${city}`);
                circle.addEventListener('click', () => handleMapClick(city));
                svgPoints.appendChild(circle);
            }
        }

        // 點擊地圖圓點的處理邏輯
        function handleMapClick(city) {
            // 1. 更新圓點的視覺活躍狀態
            if (currentActiveCity) {
                const prevDot = document.getElementById(`dot-${currentActiveCity}`);
                if(prevDot) prevDot.classList.remove('active');
            }
            const activeDot = document.getElementById(`dot-${city}`);
            if(activeDot) activeDot.classList.add('active');
            currentActiveCity = city;

            // 2. 過濾該城市的博物館
            const filteredMuseums = museumData.filter(m => m.ci === city);

            // 3. 更新右側面板狀態文字
            filterStatus.innerHTML = `📍 探索中：<b>${city}</b> (${filteredMuseums.length} 間)`;

            // 4. 重新渲染右側清單
            listContainer.innerHTML = '';
            filteredMuseums.forEach(m => {
                const li = document.createElement('li');
                li.className = 'museum-item';
                
                const html = `
                    <h3>${m.n}</h3>
                    <p>📍 ${m.co}, ${m.ci}</p>
                    <div class="feature-tag">💡 特色：${m.f}</div>
                    <a href="${m.u}" target="_blank" class="museum-link">🚀 進入兒童專屬網站</a>
                `;
                li.innerHTML = html;
                listContainer.appendChild(li);
            });
        }
    </script>
</body>
</html>
