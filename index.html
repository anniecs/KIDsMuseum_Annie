    <style>
        /* 童話風整體背景 */

            color: #5c4a4d;
            margin: 0;
            padding: 20px;
            display: flex;

            align-items: center;

        }

        /* 移除行動裝置點擊的高光與預設 focus */
        button, a, select, .map-dot {

        }

            letter-spacing: 2px;
            text-align: center;
        }

        p.subtitle {
            color: #8fa0b3;
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* 主內容佈局：左側地圖與篩選，右側清單 */
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
            align-items: flex-start;
        }

        /* 左側區域 */
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 篩選器容器 */
        .search-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 143, 171, 0.2);
            border: 4px dashed #bde0fe;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        label {
            font-size: 0.95em;
            color: #ffb5a7;
            font-weight: bold;
            background: #fff;
            padding: 2px 10px;
            border-radius: 10px;
        }

        select {
            padding: 10px 15px;
            border: 3px solid #ffc2d1;
            border-radius: 20px;
            background-color: #fff;
            color: #5c4a4d;
            font-size: 1em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-width: 200px;
            appearance: none;

            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        select:hover, select:focus {
            border-color: #ff99ac;
            box-shadow: 0 0 10px rgba(255, 153, 172, 0.4);
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            background-color: #e6f9ff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 5px solid #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .map-wrapper::before {
            content: "🍄 請確認已將圖片存為 map.png 🍄";
            position: absolute;
            color: #ff99ac;
            font-size: 1em;
            font-weight: bold;
            z-index: 0;
        }

        .base-map {
            width: 100%;
            display: block;
            position: relative;
            z-index: 1;
        }

        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 會呼吸的魔法圓點 */
        .map-dot {
            fill: rgba(255, 209, 102, 0.85);
            stroke: rgba(255, 107, 107, 0.9);
            cursor: pointer;
            pointer-events: auto;
            transform-origin: center;
            animation: breathe 2s infinite alternate;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: none; /* 預設隱藏，由 JS 控制顯示 */

        @keyframes breathe {
            0% { r: 1.0; stroke-width: 0.3; }
            100% { r: 1.5; stroke-width: 0.5; filter: drop-shadow(0 0 3px rgba(255, 209, 102, 0.8)); }
        }

        .map-dot:hover, .map-dot.active {
            fill: rgba(6, 214, 160, 0.95);
            stroke: #fff;
            r: 2.2;
            stroke-width: 0.6;
            animation: none;
            filter: drop-shadow(0 0 5px rgba(6, 214, 160, 0.8));
        }

        .right-panel {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;

            position: sticky;
            top: 20px;

            text-align: center;
            margin-bottom: 15px;
            background: #fdf5f6;
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .museum-list {
            list-style: none;
            padding: 0;
            margin: 0;

        .museum-item {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-left: 6px solid #ffb5a7;
            animation: fadeIn 0.4s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cat-tag {
            display: inline-block;
            background: #ffd166;
            color: #5c4a4d;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 8px;

            color: #5c4a4d;
            font-size: 1.2em;

        .museum-item p {

            color: #7a8b9e;
            font-size: 0.9em;
            line-height: 1.4;
        }

            display: inline-block;
            background: #fff0f3;
            color: #ff6b6b;
            padding: 5px 10px;
            border-radius: 12px;

            font-weight: bold;

            color: #5c4a4d;
            background-color: #84dcc6;
            font-weight: bold;
            font-size: 0.95em;

            border-radius: 20px;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0px #5ebaa4;

            transform: translateY(2px);
            box-shadow: 0 2px 0px #5ebaa4;
        }

            color: #bde0fe;
            margin-top: 50px;
            font-size: 4em;
        }
        .empty-state p {
            font-size: 0.25em;
            color: #8fa0b3;
            margin-top: 10px;
        }

            margin-top: 5px;
            margin-bottom: 15px;
            background: #ffb5a7;
            color: white;
            border: none;
            padding: 8px 15px;

            font-weight: bold;

        }

            transform: translateY(2px);
            box-shadow: 0 1px 0 #e59a8e;
        }

            .main-container { flex-direction: column; }

        }

            { cat: "綜合與特殊主題", n: "Roald Dahl Museum Join In", co: "英國", ci: "大米森登", u: "https://www.roalddahlmuseum.org/join-in/", f: "結合《巧克力冒險工廠》的文學想像力網站" },
            { cat: "綜合與特殊主題", n: "MoMath 國家數學博物館", co: "美國", ci: "紐約", u: "https://momath.org/", f: "顛覆傳統！提供各種線上趣味數學與邏輯遊戲" },
            { cat: "綜合與特殊主題", n: "SPYSCAPE 間諜博物館", co: "美國", ci: "紐約", u: "https://spyscape.com/", f: "適合大孩子的解謎任務與密碼學挑戰遊戲" },
            { cat: "綜合與特殊主題", n: "National Museum of Play 斯特朗遊戲博物館", co: "美國", ci: "羅徹斯特", u: "https://www.museumofplay.org/", f: "以「玩樂」歷史為主題，提供各年代線上玩具圖鑑" },
            { cat: "綜合與特殊主題", n: "CMA 兒童藝術博物館", co: "美國", ci: "紐約", u: "https://cmany.org/", f: "鼓勵孩子利用環保廢棄物進行創意藝術計畫" },
            { cat: "綜合與特殊主題", n: "Discover Children's Story Centre", co: "英國", ci: "倫敦", u: "https://discover.org.uk/", f: "專注於啟發說故事能力與角色扮演的線上資源" },
            { cat: "綜合與特殊主題", n: "Eureka! 尤里卡國家兒童博物館", co: "英國", ci: "哈利法克斯", u: "https://www.eureka.org.uk/", f: "生動活潑的人體構造與生活科學兒童資源" },
            { cat: "綜合與特殊主題", n: "Young V&A (原 V&A 兒童博物館)", co: "英國", ci: "倫敦", u: "https://www.vam.ac.uk/young", f: "展示各個年代的玩具設計與兒童用品發展史" }
        ];

        // --- 城市地圖座標 ---
        const cityCoords = {
            "台北": {l: 81.5, t: 44.5}, "紐約": {l: 30.5, t: 32.5}, "倫敦": {l: 46.5, t: 27.5}, 
            "巴黎": {l: 48.0, t: 29.5}, "洛杉磯": {l: 17.5, t: 38.5}, "阿姆斯特丹": {l: 49.5, t: 26.5}, 
            "墨爾本": {l: 88.5, t: 78.0}, "華盛頓特區": {l: 29.5, t: 34.5}, "新加坡": {l: 76.0, t: 58.0}, 
            "芝加哥": {l: 23.5, t: 33.5}, "馬德里": {l: 45.5, t: 33.5}, "佛羅倫斯": {l: 50.5, t: 30.5}, 
            "東京": {l: 84.5, t: 36.5}, "舊金山": {l: 16.0, t: 36.0}, "蒙特瑞": {l: 16.5, t: 37.0}, 
            "聖地牙哥": {l: 18.5, t: 40.0}, "雪梨": {l: 92.0, t: 75.5}, "費城": {l: 30.0, t: 33.5}, 
            "邁阿密": {l: 28.0, t: 42.0}, "坎培拉": {l: 91.0, t: 76.5}, "威靈頓": {l: 96.0, t: 78.5}, 
            "多倫多": {l: 28.0, t: 31.5}, "雅典": {l: 53.0, t: 35.5}, "墨西哥城": {l: 22.0, t: 48.0}, 
            "印第安納波利斯": {l: 25.0, t: 34.0}, "波士頓": {l: 31.0, t: 31.5}, "大米森登": {l: 46.2, t: 27.2}, 
            "羅徹斯特": {l: 28.5, t: 31.0}, "哈利法克斯": {l: 45.5, t: 26.0}
        };

        const svgPoints = document.getElementById('svg-points');
        const categorySelect = document.getElementById('category-select');
        const countrySelect = document.getElementById('country-select');
        const listContainer = document.getElementById('museum-list-container');
        const filterStatus = document.getElementById('filter-status');
        const btnReset = document.getElementById('btn-reset');
        
        let mapSelectedCity = null; // 記錄透過地圖點擊鎖定的城市

        // 初始化：繪製地圖魔法圓點
        for (const [city, coords] of Object.entries(cityCoords)) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", coords.l + "%");
            circle.setAttribute("cy", coords.t + "%");
            circle.setAttribute("class", "map-dot");
            circle.setAttribute("id", `dot-${city}`);
            circle.setAttribute("data-city", city);
            circle.addEventListener('click', () => handleMapClick(city));
            svgPoints.appendChild(circle);
        }

        // --- 核心邏輯 ---

        // 更新第二層「國家」下拉選單
        function updateCountryDropdown(category) {
            countrySelect.innerHTML = '<option value="all">【不限國家】</option>';
            let filteredData = museumData;
            if (category !== 'all') {
                filteredData = museumData.filter(m => m.cat === category);
            }
            
            // 提取該分類下獨一無二的國家名單
            const countries = [...new Set(filteredData.map(m => m.co))].sort();
            countries.forEach(c => {
                countrySelect.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        // 渲染畫面 (根據選單與地圖點擊狀態)
        function renderUI() {
            const currentCat = categorySelect.value;
            const currentCountry = countrySelect.value;

            // 1. 篩選資料庫
            let results = museumData;
            
            // 下拉選單篩選
            if (currentCat !== 'all') results = results.filter(m => m.cat === currentCat);
            if (currentCountry !== 'all') results = results.filter(m => m.co === currentCountry);

            // 取得目前篩選條件下「合法」的城市名單
            const validCities = new Set(results.map(m => m.ci));

            // 地圖鎖定篩選 (優先級最高)
            if (mapSelectedCity) {
                results = results.filter(m => m.ci === mapSelectedCity);
            }

            // 2. 更新右側博物館清單
            listContainer.innerHTML = '';
            if (results.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        🦕
                        <p>找不到符合條件的博物館唷！</p>
                    </div>`;
            } else {
                results.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'museum-item';
                    li.innerHTML = `
                        <div class="cat-tag">${m.cat}</div>
                        <h3>${m.n}</h3>
                        <p>📍 ${m.co}, ${m.ci}</p>
                        <div class="feature-tag">💡 特色：${m.f}</div>
                        <a href="${m.u}" target="_blank" class="museum-link">🚀 進入專屬網站</a>
                    `;
                    listContainer.appendChild(li);
                });
            }

            // 3. 更新狀態列與重置按鈕
            if (mapSelectedCity) {
                filterStatus.innerHTML = `📍 鎖定地圖城市：<b>${mapSelectedCity}</b> (${results.length} 間)`;
                btnReset.style.display = 'block';
            } else {
                let statusMsg = `目前顯示：`;
                statusMsg += (currentCat === 'all') ? '所有分類' : currentCat;
                statusMsg += (currentCountry === 'all') ? ' (所有國家)' : ` (${currentCountry})`;
                statusMsg += `，共 ${results.length} 間`;
                filterStatus.innerHTML = statusMsg;
                btnReset.style.display = 'none';
            }

            // 4. 更新地圖圓點顯示狀態
            document.querySelectorAll('.map-dot').forEach(dot => {
                const city = dot.getAttribute('data-city');
                // 如果這個城市在當前下拉選單條件中有資料，就顯示出來
                if (validCities.has(city)) {
                    dot.style.display = 'block';
                    // 如果剛好是被點擊鎖定的城市，加強發光
                    if (city === mapSelectedCity) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                } else {
                    dot.style.display = 'none';
                    dot.classList.remove('active');
                }
            });
        }

        // --- 互動事件綁定 ---

        // 第一層：分類變更
        categorySelect.addEventListener('change', function() {
            mapSelectedCity = null; // 切換大分類時，解除地圖鎖定
            updateCountryDropdown(this.value);
            renderUI();
        });

        // 第二層：國家變更
        countrySelect.addEventListener('change', function() {
            mapSelectedCity = null; // 切換國家時，解除地圖鎖定
            renderUI();
        });

        // 地圖圓點點擊
        function handleMapClick(city) {
            mapSelectedCity = city;
            renderUI();
        }

        // 解除地圖鎖定按鈕
        btnReset.addEventListener('click', () => {
            mapSelectedCity = null;
            renderUI();
        });

        // 初始載入
        updateCountryDropdown('all');
        renderUI();

    </script>
