<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨世界兒童博物館奇幻地圖✨</title>
    <style>
        /* CSS 變數定義，方便日夜模式切換 */
        :root {
            --bg-gradient: linear-gradient(180deg, #fbf7f0 0%, #eaddce 100%);
            --text-main: #5c4d4a;
            --text-sub: #8c7c75;
            --title-color: #b87365;
            --panel-bg: rgba(255, 253, 250, 0.95);
            --border-color: #d9c5b2;
            --item-bg: #fff;
            --tag-bg: #f4e8e1;
            --map-bg: #f6f0e4;
            --btn-blue: #8ba3b5;
            --btn-blue-hover: #a1b6c7;
        }

        /* 黑夜星空模式變數 */
        body.dark-mode {
            --bg-gradient: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            --text-main: #eaddce;
            --text-sub: #b1c5d4;
            --title-color: #f4e8e1;
            --panel-bg: rgba(22, 33, 62, 0.85);
            --border-color: #536b88;
            --item-bg: #1a2a47;
            --tag-bg: #2a3f5f;
            --map-bg: #0b132b;
            --btn-blue: #e94560; /* 黑夜模式的按鈕改為溫暖星光紅 */
            --btn-blue-hover: #ff6b81;
        }

        /* 整體背景 */
        body {
            font-family: 'Comic Sans MS', 'Nunito', 'Microsoft JhengHei', cursive, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* 移除行動裝置點擊的高光與預設 focus，避免殘留記憶 */
        button, a, select, .map-dot, .theme-toggle {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* 頂部控制列 (包含日夜切換與印章進度) */
        .top-bar {
            width: 100%;
            max-width: 1350px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .passport-status {
            background: var(--panel-bg);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--title-color);
            border: 2px dashed var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            font-size: 1.5em;
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .theme-toggle:hover { transform: scale(1.1); }

        /* 標題設計 */
        h1 {
            color: var(--title-color);
            font-size: 2.5em;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.3);
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.3s;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        /* 主內容佈局 */
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
            align-items: flex-start;
        }

        /* 左側區域 */
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 篩選器容器 */
        .search-container {
            background-color: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 4px dashed var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        label {
            font-size: 0.95em;
            color: var(--title-color);
            font-weight: bold;
            background: var(--item-bg);
            padding: 2px 10px;
            border-radius: 10px;
        }

        select {
            padding: 10px 15px;
            border: 3px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--item-bg);
            color: var(--text-main);
            font-size: 1em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-width: 200px;
            appearance: none;
        }

        /* 地圖區域 */
        .map-wrapper {
            position: relative;
            width: 100%;
            background-color: var(--map-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 5px solid var(--item-bg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            transition: background-color 0.5s;
        }

        /* 夜間模式的星星裝飾 */
        body.dark-mode .map-wrapper::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px);
            background-size: 100px 100px, 60px 60px;
            background-position: 0 0, 20px 20px;
            opacity: 0.3;
            pointer-events: none;
        }

        .base-map { width: 100%; display: block; position: relative; z-index: 1; transition: filter 0.5s; }
        body.dark-mode .base-map { filter: brightness(0.7) contrast(1.2); }

        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* 會呼吸的魔法圓點 */
        .map-dot {
            fill: rgba(235, 185, 95, 0.85);
            stroke: rgba(200, 115, 101, 0.9);
            cursor: pointer;
            pointer-events: auto;
            transform-origin: center;
            animation: breathe 2s infinite alternate;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: none; 
        }

        /* 黑夜模式的圓點變成發光的星星 */
        body.dark-mode .map-dot {
            fill: #ffeb3b;
            stroke: #fff;
            filter: drop-shadow(0 0 8px #ffeb3b);
        }

        @keyframes breathe {
            0% { r: 1.0; stroke-width: 0.3; }
            100% { r: 1.5; stroke-width: 0.5; filter: drop-shadow(0 0 3px rgba(235, 185, 95, 0.8)); }
        }

        .map-dot:hover, .map-dot.active {
            fill: rgba(139, 163, 181, 0.95);
            stroke: #fff;
            r: 2.2;
            stroke-width: 0.6;
            animation: none;
            filter: drop-shadow(0 0 5px rgba(139, 163, 181, 0.8));
        }
        body.dark-mode .map-dot.active { fill: #e94560; filter: drop-shadow(0 0 10px #e94560); }

        /* 右側區域 */
        .right-panel {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 4px dashed var(--border-color);
            min-height: 500px;
            max-height: 750px;
            overflow-y: auto;
            position: sticky;
            top: 20px;
            min-width: 350px;
            transition: all 0.3s;
        }

        .right-panel h2 {
            color: var(--title-color);
            text-align: center; margin-top: 0; margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color); padding-bottom: 10px;
        }

        .filter-status {
            font-size: 1em; color: var(--text-sub); text-align: center;
            margin-bottom: 15px; background: var(--tag-bg); padding: 10px;
            border-radius: 15px; font-weight: bold;
        }

        /* 動作按鈕群 (任意門 & 重置) */
        .action-buttons {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        
        .btn-magic, .btn-reset {
            flex: 1;
            color: white; border: none; padding: 10px 10px;
            border-radius: 15px; cursor: pointer; font-weight: bold;
            transition: 0.2s; font-size: 1em;
        }
        
        .btn-magic {
            background: #e5b25d; box-shadow: 0 3px 0 #c79a4e;
        }
        .btn-magic:hover { transform: translateY(2px); box-shadow: 0 1px 0 #c79a4e; }
        
        .btn-reset {
            background: #d4a390; box-shadow: 0 3px 0 #b58876; display: none;
        }
        .btn-reset:hover { transform: translateY(2px); box-shadow: 0 1px 0 #b58876; }

        /* 博物館列表樣式 */
        .museum-list { list-style: none; padding: 0; margin: 0; }

        .museum-item {
            margin-bottom: 20px; background: var(--item-bg); padding: 15px;
            border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 6px solid var(--title-color); animation: fadeIn 0.4s ease-in;
            position: relative;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 護照印章樣式 */
        .stamp-badge {
            position: absolute; right: 10px; top: 10px;
            width: 45px; height: 45px; opacity: 0.8;
            transform: rotate(-15deg); display: none; pointer-events: none;
        }
        .museum-item.visited .stamp-badge { display: block; animation: stampPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes stampPop { 0% { transform: scale(2) rotate(0deg); opacity: 0; } 100% { transform: scale(1) rotate(-15deg); opacity: 0.8; } }

        .cat-tag {
            display: inline-block; background: #e3ccaa; color: #5c4d4a;
            padding: 3px 8px; border-radius: 10px; font-size: 0.75em;
            font-weight: bold; margin-bottom: 8px;
        }

        .museum-item h3 { margin: 0 0 8px 0; color: var(--text-main); font-size: 1.15em; padding-right: 40px; }
        .museum-item p { margin: 0 0 8px 0; color: var(--text-sub); font-size: 0.9em; line-height: 1.4; }
        .feature-tag {
            display: inline-block; background: var(--tag-bg); color: var(--title-color);
            padding: 5px 10px; border-radius: 12px; font-size: 0.85em;
            font-weight: bold; margin-bottom: 12px;
        }

        /* 連結按鈕 */
        .museum-link {
            text-decoration: none; color: #fff; background-color: var(--btn-blue);
            font-weight: bold; font-size: 0.95em; display: block;
            padding: 10px 15px; border-radius: 20px; text-align: center;
            transition: all 0.2s; box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }
        .museum-link:hover {
            background-color: var(--btn-blue-hover); transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.15); color: #fff;
        }

        .empty-state { text-align: center; color: var(--border-color); margin-top: 50px; font-size: 4em; }
        .empty-state p { font-size: 0.25em; color: var(--text-sub); margin-top: 10px; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .right-panel { width: 100%; box-sizing: border-box; min-height: 400px; }
        }
    </style>
</head>
<body>

            { cat: "歷史、人文與傳統文化", n: "NMAAHC Kids 非裔歷史文化博物館", co: "美國", ci: "華盛頓特區", u: "https://nmaahc.si.edu/learn/early-childhood", f: "以兒童視角出發，傳遞平權歷史與文化包容" },
            { cat: "歷史、人文與傳統文化", n: "MNA Kids 國立人類學博物館", co: "墨西哥", ci: "墨西哥城", u: "https://www.mna.inah.gob.mx/", f: "帶領兒童探索神秘的阿茲特克與馬雅古文明" },
            { cat: "歷史、人文與傳統文化", n: "NMAI 美國印第安人國家博物館", co: "美國", ci: "華盛頓特區", u: "https://americanindian.si.edu/nk360", f: "北美原住民傳說動畫與傳統工藝線上教學" },

            // 綜合與特殊主題 (10間)
            { cat: "綜合與特殊主題", n: "Children's Museum of Indianapolis", co: "美國", ci: "印第安納波利斯", u: "https://www.childrensmuseum.org/museum-at-home", f: "全球最大兒童博物館線上體驗與居家勞作" },
            { cat: "綜合與特殊主題", n: "Boston Children's Museum", co: "美國", ci: "波士頓", u: "https://bostonchildrensmuseum.org/play-learn/", f: "注重孩童感覺統合、生活技能與日常科學" },
            { cat: "綜合與特殊主題", n: "Roald Dahl Museum Join In", co: "英國", ci: "大米森登", u: "https://www.roalddahlmuseum.org/join-in/", f: "結合《巧克力冒險工廠》的文學想像力網站" },
            { cat: "綜合與特殊主題", n: "MoMath 國家數學博物館", co: "美國", ci: "紐約", u: "https://momath.org/", f: "顛覆傳統！提供各種線上趣味數學與邏輯遊戲" },
            { cat: "綜合與特殊主題", n: "SPYSCAPE 間諜博物館", co: "美國", ci: "紐約", u: "https://spyscape.com/", f: "適合大孩子的解謎任務與密碼學挑戰遊戲" },
            { cat: "綜合與特殊主題", n: "National Museum of Play 斯特朗遊戲", co: "美國", ci: "羅徹斯特", u: "https://www.museumofplay.org/", f: "以「玩樂」歷史為主題，提供各年代線上玩具圖鑑" },
            { cat: "綜合與特殊主題", n: "CMA 兒童藝術博物館", co: "美國", ci: "紐約", u: "https://cmany.org/", f: "鼓勵孩子利用環保廢棄物進行創意藝術計畫" },
            { cat: "綜合與特殊主題", n: "Discover Children's Story Centre", co: "英國", ci: "倫敦", u: "https://discover.org.uk/", f: "專注於啟發說故事能力與角色扮演的線上資源" },
            { cat: "綜合與特殊主題", n: "Eureka! 尤里卡國家兒童博物館", co: "英國", ci: "哈利法克斯", u: "https://www.eureka.org.uk/", f: "生動活潑的人體構造與生活科學兒童資源" },
            { cat: "綜合與特殊主題", n: "Young V&A (原 V&A 兒童博物館)", co: "英國", ci: "倫敦", u: "https://www.vam.ac.uk/young", f: "展示各個年代的玩具設計與兒童用品發展史" }
        ];

        // --- 城市地圖座標 ---
        const cityCoords = {
            "台北": {l: 81.5, t: 44.5}, "紐約": {l: 30.5, t: 32.5}, "倫敦": {l: 46.5, t: 27.5}, 
            "巴黎": {l: 48.0, t: 29.5}, "洛杉磯": {l: 17.5, t: 38.5}, "阿姆斯特丹": {l: 49.5, t: 26.5}, 
            "墨爾本": {l: 88.5, t: 78.0}, "華盛頓特區": {l: 29.5, t: 34.5}, "新加坡": {l: 76.0, t: 58.0}, 
            "芝加哥": {l: 23.5, t: 33.5}, "馬德里": {l: 45.5, t: 33.5}, "佛羅倫斯": {l: 50.5, t: 30.5}, 
            "東京": {l: 84.5, t: 36.5}, "舊金山": {l: 16.0, t: 36.0}, "蒙特瑞": {l: 16.5, t: 37.0}, 
            "聖地牙哥": {l: 18.5, t: 40.0}, "雪梨": {l: 92.0, t: 75.5}, "費城": {l: 30.0, t: 33.5}, 
            "邁阿密": {l: 28.0, t: 42.0}, "坎培拉": {l: 91.0, t: 76.5}, "威靈頓": {l: 96.0, t: 78.5}, 
            "多倫多": {l: 28.0, t: 31.5}, "雅典": {l: 53.0, t: 35.5}, "墨西哥城": {l: 22.0, t: 48.0}, 
            "印第安納波利斯": {l: 25.0, t: 34.0}, "波士頓": {l: 31.0, t: 31.5}, "大米森登": {l: 46.2, t: 27.2}, 
            "羅徹斯特": {l: 28.5, t: 31.0}, "哈利法克斯": {l: 45.5, t: 26.0}
        };

        const svgPoints = document.getElementById('svg-points');
        const categorySelect = document.getElementById('category-select');
        const countrySelect = document.getElementById('country-select');
        const listContainer = document.getElementById('museum-list-container');
        const filterStatus = document.getElementById('filter-status');
        const btnReset = document.getElementById('btn-reset');
        const passportStatus = document.getElementById('passport-status');
        
        let mapSelectedCity = null; 
        
        // 讀取本地護照印章紀錄
        let visitedMuseums = JSON.parse(localStorage.getItem('visitedMuseums')) || [];

        // 初始化：繪製地圖魔法圓點
        for (const [city, coords] of Object.entries(cityCoords)) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", coords.l + "%");
            circle.setAttribute("cy", coords.t + "%");
            circle.setAttribute("class", "map-dot");
            circle.setAttribute("id", `dot-${city}`);
            circle.setAttribute("data-city", city);
            circle.addEventListener('click', function() { handleMapClick(city); this.blur(); });
            svgPoints.appendChild(circle);
        }

        // --- 功能 1: 更新護照印章 ---
        function updatePassport() {
            passportStatus.textContent = `🏅 收集印章：${visitedMuseums.length} / 50`;
        }

        // 當孩子點擊連結時記錄印章
        window.markVisited = function(museumName) {
            if (!visitedMuseums.includes(museumName)) {
                visitedMuseums.push(museumName);
                localStorage.setItem('visitedMuseums', JSON.stringify(visitedMuseums));
                updatePassport();
                renderUI(); // 重新渲染以顯示印章
            }
        };

        // --- 功能 2: 魔法任意門 (隨機選擇) ---
        function magicDoor() {
            const randomIndex = Math.floor(Math.random() * museumData.length);
            const randomMuseum = museumData[randomIndex];
            
            // 重置下拉選單
            categorySelect.value = "all";
            updateCountryDropdown("all");
            countrySelect.value = "all";
            
            // 鎖定隨機抽到的城市
            mapSelectedCity = randomMuseum.ci;
            renderUI();
            
            // 讓右側清單捲動到最上方
            document.querySelector('.right-panel').scrollTop = 0;
        }

        // --- 功能 4: 日夜模式切換 ---
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-btn');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                btn.textContent = '🌙';
            } else {
                btn.textContent = '🌞';
            }
        }

        // 更新第二層「國家」下拉選單
        function updateCountryDropdown(category) {
            countrySelect.innerHTML = '<option value="all">【不限國家】</option>';
            let filteredData = museumData;
            if (category !== 'all') {
                filteredData = museumData.filter(m => m.cat === category);
            }
            const countries = [...new Set(filteredData.map(m => m.co))].sort();
            countries.forEach(c => {
                countrySelect.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        // 渲染畫面
        function renderUI() {
            const currentCat = categorySelect.value;
            const currentCountry = countrySelect.value;

            let results = museumData;
            
            if (currentCat !== 'all') results = results.filter(m => m.cat === currentCat);
            if (currentCountry !== 'all') results = results.filter(m => m.co === currentCountry);

            const validCities = new Set(results.map(m => m.ci));

            if (mapSelectedCity) {
                results = results.filter(m => m.ci === mapSelectedCity);
            }

            listContainer.innerHTML = '';
            if (results.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        🦕
                        <p>找不到符合條件的博物館唷！</p>
                    </div>`;
            } else {
                results.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'museum-item';
                    
                    // 檢查是否已造訪，加入 visited class
                    if (visitedMuseums.includes(m.n)) {
                        li.classList.add('visited');
                    }
                    
                    // 護照印章圖片 (使用可愛的 Emoji 當印章)
                    const stampHtml = `<div class="stamp-badge"><span style="font-size: 40px;">💮</span></div>`;

                    li.innerHTML = `
                        ${stampHtml}
                        <div class="cat-tag">${m.cat}</div>
                        <h3>${m.n}</h3>
                        <p>📍 ${m.co}, ${m.ci}</p>
                        <div class="feature-tag">💡 特色：${m.f}</div>
                        <a href="${m.u}" target="_blank" class="museum-link" onclick="markVisited('${m.n}'); this.blur();">🚀 進入專屬網站</a>
                    `;
                    listContainer.appendChild(li);
                });
            }

            if (mapSelectedCity) {
                filterStatus.innerHTML = `📍 鎖定地圖城市：<b>${mapSelectedCity}</b> (${results.length} 間)`;
                btnReset.style.display = 'block';
            } else {
                let statusMsg = `目前顯示：`;
                statusMsg += (currentCat === 'all') ? '所有分類' : currentCat;
                statusMsg += (currentCountry === 'all') ? ' (所有國家)' : ` (${currentCountry})`;
                statusMsg += `，共 ${results.length} 間`;
                filterStatus.innerHTML = statusMsg;
                btnReset.style.display = 'none';
            }

            document.querySelectorAll('.map-dot').forEach(dot => {
                const city = dot.getAttribute('data-city');
                if (validCities.has(city)) {
                    dot.style.display = 'block';
                    if (city === mapSelectedCity) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                } else {
                    dot.style.display = 'none';
                    dot.classList.remove('active');
                }
            });
        }

        categorySelect.addEventListener('change', function() {
            mapSelectedCity = null; 
            updateCountryDropdown(this.value);
            renderUI();
        });

        countrySelect.addEventListener('change', function() {
            mapSelectedCity = null; 
            renderUI();
        });

        function handleMapClick(city) {
            mapSelectedCity = city;
            renderUI();
        }

        function resetMap() {
            mapSelectedCity = null;
            renderUI();
        }

        // 初始載入
        updatePassport();
        updateCountryDropdown('all');
        renderUI();

    </script>
</body>
